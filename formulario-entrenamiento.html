<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{ --gold:#C9A84C; --bg:#0e0f13; --panel:#16181f; --line:#262a33; --txt:#f2f2f2; --muted:#8a8f9c; }
  body{ font-family:'Segoe UI',system-ui,Arial,sans-serif; background:var(--bg); color:var(--txt); padding:0 0 120px; -webkit-text-size-adjust:100%; }
  .wrap{ max-width:660px; margin:0 auto; padding:0 16px; }
  .logo-band{ background:#fff; border-radius:0 0 16px 16px; padding:14px 16px; text-align:center; margin-bottom:16px; }
  .logo-band img{ height:46px; width:auto; max-width:100%; display:inline-block; }
  h1{ font-size:20px; font-weight:800; margin:6px 0 4px; }
  .lead{ font-size:12px; color:var(--muted); margin-bottom:14px; line-height:1.5; }
  .leg{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:16px; display:flex; flex-direction:column; gap:5px; }
  .leg div{ font-size:12px; }
  .leg b{ color:var(--gold); }
  .meta{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .meta input{ flex:1; min-width:130px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; color:var(--txt); font-size:13px; font-family:inherit; outline:none; }
  .meta input:focus{ border-color:var(--gold); }
  .meta input::placeholder{ color:var(--muted); }
  .sec{ margin-bottom:16px; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--panel); }
  .sec-hd{ padding:12px 14px; } .sec-hd .t{ font-size:12px; font-weight:800; letter-spacing:1.5px; color:var(--gold); }
  .exc{ padding:10px 14px; border-top:1px solid #1e222b; }
  .exc:first-of-type{ border-top:none; }
  .exc-top{ display:flex; align-items:center; gap:10px; }
  .exc-name{ flex:1; font-size:13px; line-height:1.25; }
  .exc-top input.n{ width:66px; background:#0f1116; border:1px solid var(--line); border-radius:8px; padding:7px 6px; color:var(--txt); font-size:13px; text-align:center; font-family:inherit; outline:none; }
  .exc-top input.n:focus{ border-color:var(--gold); }
  .exc-top input.reps{ width:56px; }
  .tags{ display:flex; gap:5px; margin-top:8px; }
  .tg{ width:36px; height:32px; border-radius:9px; border:1px solid var(--line); background:#0f1116; font-size:15px; cursor:pointer; line-height:1; display:flex; align-items:center; justify-content:center; filter:grayscale(.7) opacity(.55); transition:.12s; }
  .tg.on{ filter:none; transform:scale(1.05); }
  .tg[data-cat="mas"].on{ border-color:#C9A84C; background:#3a2f10; }
  .tg[data-cat="no"].on{ border-color:#e05656; background:#3a1414; }
  .tg[data-cat="mol"].on{ border-color:#e0a94c; background:#3a2c10; }
  .tg[data-cat="prog"].on{ border-color:#3fbf6f; background:#123020; }
  .tg[data-cat="mant"].on{ border-color:#4f8ef7; background:#132038; }
  .bar{ position:fixed; left:0; right:0; bottom:0; background:rgba(14,15,19,.96); backdrop-filter:blur(6px); border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); }
  .bar-inner{ max-width:660px; margin:0 auto; display:flex; gap:10px; }
  .btn{ flex:1; border:none; border-radius:12px; padding:14px; font-size:14px; font-weight:800; cursor:pointer; font-family:inherit; letter-spacing:.3px; }
  .btn-wa{ background:linear-gradient(135deg,#25D366,#128C7E); color:#fff; }
  .btn-copy{ background:transparent; border:1px solid var(--line); color:var(--txt); flex:0 0 120px; }
  .toast{ position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:var(--gold); color:#2a2008; font-weight:800; font-size:13px; padding:10px 18px; border-radius:10px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:50; }
  .toast.show{ opacity:1; }
  @media(max-width:420px){ .tg{ width:33px; } .exc-name{ font-size:12px; } .exc-top input.n{ width:58px; } .exc-top input.reps{ width:48px; } }
</style>

  "ESPALDA":["Dominadas","Dominadas lastradas","Jalón al pecho","Remo sentado","Remo pecho apoyado","Remo unilateral","Pullover en polea"],
  "HOMBROS":["Press militar barra","Press militar mancuernas","Press máquina","Elevaciones laterales","Pájaros","Face Pull"],
  "BÍCEPS":["Curl barra EZ","Curl alternado","Curl inclinado","Curl martillo","Curl polea"],
  "TRÍCEPS":["Pushdown barra","Pushdown cuerda","Extensión sobre cabeza","Fondos","Press cerrado"],
  "CUÁDRICEPS":["Sentadilla Smith","Prensa","Hack","Extensión de cuádriceps"],
  "GLÚTEOS":["Hip Thrust","Patada en polea","Abducción","Banco 45°"],
  "ISQUIOS":["Peso muerto rumano","Camilla femoral","Femoral sentado"],
  "GEMELOS":["Gemelos de pie","Gemelos sentado"],
  "CORE":["Ab Wheel","Crunch polea","Elevaciones de piernas","Plancha"]
};
const CATS = [
  {k:"mas",e:"⭐",t:"⭐ Los que más siento"},
  {k:"no",e:"🚫",t:"🚫 No me gustan"},
  {k:"mol",e:"⚠️",t:"⚠️ Me generan molestia"},
  {k:"prog",e:"💪",t:"💪 Siempre progreso"},
  {k:"mant",e:"🎯",t:"🎯 Mantener sí o sí"}
];
const WA_NUM = "5491133379873"; // dejar vacío para elegir contacto al enviar

function render(){
  let html='';
  Object.keys(DATA).forEach(sec=>{
    html+='<div class="sec" data-sec="'+sec+'"><div class="sec-hd"><span class="t">'+sec+'</span></div>';
    DATA[sec].forEach(ex=>{
      html+='<div class="exc">'
        + '<div class="exc-top"><div class="exc-name">'+ex+'</div>'
        + '<input class="n peso" type="number" inputmode="decimal" placeholder="kg">'
        + '<input class="n reps" type="number" inputmode="numeric" placeholder="reps"></div>'
        + '<div class="tags">'+CATS.map(c=>'<button class="tg" data-cat="'+c.k+'" title="'+c.t+'" onclick="_tag(this)">'+c.e+'</button>').join('')+'</div>'
        + '</div>';
    });
    html+='</div>';
  });
  document.getElementById('secs').innerHTML=html;
  const fe=document.getElementById('f-fecha'); if(fe) fe.value=new Date().toISOString().slice(0,10);
}
function _tag(b){ b.classList.toggle('on'); }
function _toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1800); }
function _algo(){ return document.querySelectorAll('.tg.on').length>0 || [...document.querySelectorAll('.peso,.reps')].some(i=>i.value.trim()); }
function _buildMsg(){
  const nombre=(document.getElementById('f-nombre').value||'').trim();
  const fecha=(document.getElementById('f-fecha').value||'');
  let out='MI ENTRENAMIENTO'+(nombre?(' — '+nombre):'')+(fecha?(' ('+fecha+')'):'')+'\n';
  // Bloque de pesos
  let pesos='';
  document.querySelectorAll('.sec').forEach(s=>{
    const sec=s.getAttribute('data-sec'); const lin=[];
    s.querySelectorAll('.exc').forEach(r=>{
      const p=r.querySelector('.peso').value.trim(), rp=r.querySelector('.reps').value.trim();
      if(!p && !rp) return;
      let d=''; if(p) d+=p+'kg'; if(rp) d+=(d?' × ':'')+rp;
      lin.push('• '+r.querySelector('.exc-name').textContent+': '+d);
    });
    if(lin.length) pesos+='\n'+sec+'\n'+lin.join('\n')+'\n';
  });
  if(pesos) out+='\n=== PESOS ==='+pesos;
  // Bloque de preferencias
  let prefs='';
  CATS.forEach(c=>{
    const items=[];
    document.querySelectorAll('.sec').forEach(s=>{
      const sec=s.getAttribute('data-sec');
      s.querySelectorAll('.exc').forEach(r=>{
        if(r.querySelector('.tg[data-cat="'+c.k+'"]').classList.contains('on'))
          items.push('• '+r.querySelector('.exc-name').textContent+' ('+sec+')');
      });
    });
    if(items.length) prefs+='\n'+c.t+'\n'+items.join('\n')+'\n';
  });
  if(prefs) out+='\n=== PREFERENCIAS ==='+prefs;
  return out.trim();
}
function _enviarWA(){ if(!_algo()){ _toast('Completá al menos un ejercicio'); return; }
  const base=WA_NUM?('https://wa.me/'+WA_NUM+'?text='):'https://wa.me/?text='; window.open(base+encodeURIComponent(_buildMsg()),'_blank'); }
function _copiar(){ if(!_algo()){ _toast('Completá al menos un ejercicio'); return; }
  const msg=_buildMsg(); if(navigator.clipboard){ navigator.clipboard.writeText(msg).then(()=>_toast('Copiado ✓')).catch(()=>prompt('Copiá el texto:',msg)); } else prompt('Copiá el texto:',msg); }
render();
</script>
</body>
</html>
